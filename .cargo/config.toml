# Use the Cranelift codegen backend for faster dev builds.
# Cranelift produces faster-to-compile but slower-to-run code, which is ideal
# for the dev profile. Release builds fall back to LLVM for optimization.
#
# Requires nightly Rust with the `rustc-codegen-cranelift-preview` component
# (provided by fenix in shell.nix).

[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
# Dependencies benefit from LLVM's optimization, even in dev.
codegen-backend = "llvm"
